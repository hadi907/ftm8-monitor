name: 🌿 مزرعة هادي — تقرير المقارنة (عند تحديث البيانات)

on:
  push:
    paths:
      - 'farm_data.json'
  workflow_dispatch:

jobs:
  daily-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install requests openpyxl pandas

      - name: 💾 Restore last-sent state
        uses: actions/cache/restore@v4
        with:
          path: .compare_state
          key: compare-state-${{ github.run_id }}
          restore-keys: compare-state-

      - name: 🔍 Run comparison & send report
        env:
          XLSX_PATH:  Farm_Account.xlsx
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO:   hadi@ftm8.com
          GH_TOKEN:   ${{ secrets.GH_TOKEN }}
        run: python farm_compare.py


      - name: 💾 Save last-sent state
        if: always() && hashFiles('.compare_state/**') != ''
        uses: actions/cache/save@v4
        with:
          path: .compare_state
          key: compare-state-${{ github.run_id }}
