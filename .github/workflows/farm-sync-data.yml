name: 🌿 مزرعة هادي — مزامنة farm_data.json

on:
  schedule:
    # كل ساعة
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install requests

      - name: 🔄 Fetch full data from JSONBin and update farm_data.json
        env:
          JSONBIN_BIN_URL: ${{ secrets.JSONBIN_BIN_URL }}
          JSONBIN_API_KEY: ${{ secrets.JSONBIN_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import requests, json, os, time

          url = os.environ.get('JSONBIN_BIN_URL', 'https://api.jsonbin.io/v3/b/6a0c5f4b6877513b27993aed').rstrip('/') + '/latest'
          key = os.environ.get('JSONBIN_API_KEY', '$2a$10$hymkvXJ9AvDFIag8.j4sf.Qw..HkaR0Qd3KUFYkjkTMOqO6MM68DC')

          print(f"🔍 قراءة البيانات من JSONBin...")

          # ── إعادة محاولة تلقائية حتى 4 مرات لو تأخر رد JSONBin أو انقطع الاتصال ──
          # (مهلة الاتصال 15ث + مهلة القراءة 60ث بدل 20ث)
          MAX_TRIES = 4
          res = None
          last_err = None
          for attempt in range(1, MAX_TRIES + 1):
              try:
                  res = requests.get(url, headers={'X-Master-Key': key}, timeout=(15, 60))
                  print(f"Status: {res.status_code} (محاولة {attempt}/{MAX_TRIES})")
                  if res.status_code == 200:
                      break
                  last_err = f"{res.status_code} — {res.text[:200]}"
                  res = None
              except Exception as e:
                  last_err = str(e)
                  print(f"⚠️ محاولة {attempt}/{MAX_TRIES} فشلت: {e}")
                  res = None
              if attempt < MAX_TRIES:
                  time.sleep(10 * attempt)

          if res is not None:
              data = res.json().get('record', {})

              # ── تحويل المفاتيح: ps3_* → uppercase ──
              # التطبيق يحفظ بصيغة ps3_sales لكن farm_compare.py يقرأ SALES
              KEY_MAP = {
                  'ps3_sales':    'SALES',
                  'ps3_inv':      'INV',
                  'ps3_exp':      'EXP',
                  'ps3_cash':     'CASH',
                  'ps3_cust':     'CUST',
                  'ps3_waste':    'WASTE',
                  'ps3_debts':    'DEBTS',
                  'ps3_settings': 'SETTINGS',
              }
              output = {}
              for k, v in data.items():
                  output[KEY_MAP.get(k, k)] = v

              sales = output.get('SALES', [])
              print(f"✅ تم جلب {len(sales)} مبيعة")

              with open('farm_data.json', 'w', encoding='utf-8') as f:
                  json.dump(output, f, ensure_ascii=False, indent=2)
              print("✅ تم حفظ farm_data.json بمفاتيح صحيحة (SALES, INV, ...)")
          else:
              # انقطاع مؤقت من JSONBin — لا نعتبره فشلاً: الملف القديم يبقى كما هو
              # والمزامنة التالية (بعد ساعة) تحدّثه تلقائياً
              print(f"::warning::JSONBin غير متاح مؤقتاً بعد {MAX_TRIES} محاولات: {last_err}")
              print("سيتم الاحتفاظ بالملف القديم بدون تغيير — المزامنة القادمة ستحدّثه")
              raise SystemExit(0)
          PYEOF

      - name: 💾 Commit farm_data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add farm_data.json
          git diff --staged --quiet || git commit -m "تحديث farm_data.json"
          git push
        continue-on-error: true
