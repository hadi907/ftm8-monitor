name: telegram-test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send labeled test messages (does not change anything)
        env:
          T1: ${{ secrets.TELEGRAM_TOKEN }}
          C1: ${{ secrets.TELEGRAM_CHAT_ID }}
          T2: ${{ secrets.FARM_TELEGRAM_TOKEN }}
          T3: ${{ secrets.NEWS_TELEGRAM_TOKEN }}
          C3: ${{ secrets.NEWS_TELEGRAM_CHAT_ID }}
        run: |
          send() { # label token chat
            [ -n "$2" ] && [ -n "$3" ] || { echo "$1: skipped (missing secret)"; return; }
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://api.telegram.org/bot$2/sendMessage" \
              --data-urlencode "chat_id=$3" --data-urlencode "text=اختبار: $1")
            echo "$1: HTTP $code"
          }
          send "A = TELEGRAM_TOKEN + TELEGRAM_CHAT_ID" "$T1" "$C1"
          send "B = FARM_TELEGRAM_TOKEN + TELEGRAM_CHAT_ID" "$T2" "$C1"
          send "C = NEWS_TELEGRAM_TOKEN + NEWS_TELEGRAM_CHAT_ID" "$T3" "$C3"
